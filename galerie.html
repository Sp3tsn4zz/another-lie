  <main>

    <section id="galerie">
      <h2>Galerie</h2>
      <div class="filtres">
        <button class="filtre actif" data-filtre="tout">Tout</button>
        <button class="filtre" data-filtre="cover">Covers</button>
        <button class="filtre" data-filtre="logo">Logos</button>

  <iframe src="logo-3d-vvh0sn3xt.html"

  </iframe>

  <!-- VISIONNEUSE PLEIN ÉCRAN (cachée au début) -->
  <div id="visionneuse" class="cache">

    <button id="visionneuse-precedent" class="visionneuse-bouton" aria-label="Précédent">‹</button>
    <figure>
      <img id="visionneuse-image" src="" alt="">
      <figcaption>
        <h3 id="visionneuse-titre"></h3>
        <p id="visionneuse-info"></p>
        <p id="visionneuse-texte"></p>
      </figcaption>
    </figure>
    <button id="visionneuse-suivant" class="visionneuse-bouton" aria-label="Suivant">›</button>
